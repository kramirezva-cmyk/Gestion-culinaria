<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar receta | Gestión Culinaria</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>

    <div class="logo">
      <img src="Logo.png" alt="Logo de sombrero de chef color blanco">
      <p>Gestión Culinaria</p>
    </div>
  
  </header>

  <div class="pagina">
    <nav>
      <h2>Menú principal</h2><a href="dashboard.html">Dashboard Chef</a>
      <a href="cargar-receta.html">Cargar receta</a>
      <a href="validar-recetas.html">Validar recetas</a>
      <a href="busqueda.html">Búsqueda</a>
      <a href="planificador.html">Planificador</a>
      <a href="index.html">Salir</a>

      <div class="perfil">
        <a href="index.html">
          <img src="Perfil.png" alt="Icono de perfil color celeste">
        </a>
          <a href="index.html">Perfil</a>
      </div>
      
    </nav>

  <main>
    <section>
      <h1>Cargar receta</h1>
      <form action="dashboard.html" method="get">
        <div class="campo">
          <label for="nombre">Nombre de la receta</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="campo">
          <label for="clasificacion">Clasificación</label>
          <select id="clasificacion" name="clasificacion">
            <option>Desayuno</option>
            <option>Almuerzo</option>
            <option>Cena</option>
            <option>Postre</option>
          </select>
        </div>
        <div class="campo">
          <label for="dificultad">Dificultad</label>
          <select id="dificultad" name="dificultad">
            <option>Fácil</option>
            <option>Intermedia</option>
            <option>Difícil</option>
          </select>
        </div>
        <div class="campo">
          <label for="ocasion">Ocasión</label>
          <input type="text" id="ocasion" name="ocasion" placeholder="Ejemplo: cena familiar">
        </div>
        <div class="campo">
          <label for="ingredientes">Ingredientes (separados por coma)</label>
          <input type="text" id="ingredientes" name="ingredientes" required>
        </div>
        <div class="campo">
          <label for="pasos">Instrucciones paso a paso</label>
          <input type="text" id="pasos" name="pasos" required>
        </div>
        <div class="campo">
          <label for="costo">Costo estimado total (₡)</label>
          <input type="number" id="costo" name="costo" min="0">
        </div>
        <div class="campo">
          <label for="porcion">Presupuesto por porción (₡)</label>
          <input type="number" id="porcion" name="porcion" min="0">
        </div>
        <div class="botones">
          <button type="submit" class="btn">Guardar receta</button>
          <p><a href="dashboard.html" class="btn-cancelar">Cancelar</a></p>
        </div>
        
       
      </form>
    </section>
  </main>
  </div>

  <footer>
    <p>Gestión Culinaria · Proyecto SOFT-06 · CENFOTEC</p>
    <p>GestionCulinaria_25 · GestionCulinariacr · 8888-9663</p>
  </footer>
</body>
</html>
